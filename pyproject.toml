[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maternal-mortality-dashboard"
version = "0.1.0"
description = "Global maternal mortality inequality analytics and dashboard"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dashboard Engineering Team" }]
dependencies = [
  "dash==2.18.2",
  "plotly==5.24.1",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "pyarrow==18.1.0",
  "requests==2.32.3",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "python-dotenv==1.0.1",
  "pandera==0.22.1",
  "statsmodels==0.14.4",
  "matplotlib==3.10.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
